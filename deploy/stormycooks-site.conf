# Serve the custom themed 404 page (build/404.html) for missing URLs.
# Mounted into the stormycooks-nginx container at /etc/nginx/conf.d/default.conf.
server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }
}